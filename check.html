<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test VIDAA</title>
<style>
  body { background: #111; color: #eee; font: 28px/1.4 sans-serif; margin: 40px 60px; }
  h1 { font-size: 40px; margin: 0 0 20px; }
  .ok { color: #5d5; } .no { color: #e66; }
  #fn { font-size: 22px; color: #aaa; white-space: pre-wrap; }
  button { font-size: 34px; padding: 18px 40px; margin-top: 24px; border-radius: 12px; border: 4px solid #fff; background: #3355ff; color: #fff; }
  button:focus { border-color: #ffd400; }
  #res { font-size: 34px; margin-top: 20px; }
</style>
</head>
<body>
<h1>Test VIDAA : installation d'apps</h1>
<div id="summary"></div>
<button id="install" style="display:none">Installer Nuvio</button>
<div id="res"></div>
<p>Fonctions Hisense trouvées :</p>
<div id="fn"></div>
<script>
  var BASE = "https://alexandre07310-alt.github.io/nuvio-web/";
  var names = [];
  for (var k in window) {
    if (/^(Hisense|HiUtils|Hi_|vowOS|omi|VIDAA|Vidaa)/.test(k)) names.push(k);
  }
  names.sort();
  var hasLegacy = typeof window.Hisense_installApp === "function";
  var hasNew = typeof window.HiUtils_createRequest === "function";
  document.getElementById("summary").innerHTML =
    "Hisense_installApp : " + (hasLegacy ? '<b class="ok">DISPONIBLE</b>' : '<b class="no">absente</b>') + "<br>" +
    "HiUtils_createRequest : " + (hasNew ? '<b class="ok">DISPONIBLE</b>' : '<b class="no">absente</b>') + "<br>" +
    "Nombre de fonctions Hisense : <b>" + names.length + "</b>";
  document.getElementById("fn").textContent = names.join("  ") || "(aucune)";

  if (hasLegacy) {
    var btn = document.getElementById("install");
    btn.style.display = "inline-block";
    btn.focus();
    btn.onclick = function () {
      var res = document.getElementById("res");
      res.textContent = "Installation en cours...";
      try {
        window.Hisense_installApp("nuvioweb", "Nuvio", BASE + "icon.png", BASE + "icon.png",
          BASE + "icon.png", BASE, "store", function (code) {
            res.innerHTML = code === 0
              ? '<b class="ok">Installé ! Redémarre la TV, Nuvio sera à la fin des apps.</b>'
              : '<b class="no">Échec, code ' + code + "</b>";
          });
      } catch (e) {
        res.innerHTML = '<b class="no">Erreur : ' + e + "</b>";
      }
    };
  }
</script>
</body>
</html>
