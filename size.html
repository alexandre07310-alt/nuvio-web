<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Taille écran</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; font-size: 44px; }
  #frame { position: fixed; top: 0; left: 0; right: 0; bottom: 0; border: 8px solid #ffd400; }
  #info { position: relative; padding: 40px 60px; color: #fff; }
</style>
</head>
<body>
<div id="frame"></div>
<div id="info">Mesure en cours...</div>
<script>
  // Affiche ce que voit le navigateur VIDAA et le recopie dans l'adresse de la page.
  var m = "w=" + window.innerWidth + "&h=" + window.innerHeight +
    "&sw=" + screen.width + "&sh=" + screen.height +
    "&cw=" + document.documentElement.clientWidth + "&ch=" + document.documentElement.clientHeight +
    "&dpr=" + window.devicePixelRatio;
  document.getElementById("info").innerHTML = m.split("&").join("<br>");
  if (location.search.indexOf("w=") < 0) {
    setTimeout(function () { location.replace("size.html?" + m); }, 1500);
  }
</script>
</body>
</html>
