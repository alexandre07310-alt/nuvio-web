<!DOCTYPE html>
<html lang="en" class="no-flex-gap no-css-grid no-css-math no-backdrop-filter no-aspect-ratio">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Nuvio TV</title>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="assets/runtime/legacy-features.js"></script>
  <script type="module">
    import * as service from "wrt:service";
    if (typeof window !== "undefined") {
      window.__NUVIO_TIZEN_WRT_SERVICE__ = service;
    }
  </script>
  <script>
    // Ajout pour VIDAA : son navigateur ignore la balise viewport et affiche en 1280x720.
    // Nuvio mélange px fixes et vw/vh, donc on le fait tourner dans un cadre de 1920x1080
    // (vrai viewport 1080p) que l'on réduit d'un bloc pour remplir l'écran.
    (function () {
      if (window.tizen || window.webOS || window.PalmSystem || window.top !== window) return;
      var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
      var z = Math.min(w / 1920, h / 1080);
      if (z >= 0.95) return;
      var src = "index.html" + (location.search ? location.search + "&" : "?") + "frame=1" + location.hash;
      document.open();
      document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nuvio TV</title><style>' +
        'html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}' +
        'iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:0;' +
        'transform:scale(' + z + ');-webkit-transform:scale(' + z + ');' +
        'transform-origin:0 0;-webkit-transform-origin:0 0}' +
        '</style></head><body><iframe id="nuvio" src="' + src + '" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>' +
        '<script>var f=document.getElementById("nuvio");function k(){try{f.focus();f.contentWindow.focus();}catch(e){}}' +
        'f.onload=k;window.onfocus=k;document.onkeydown=k;setInterval(function(){if(document.activeElement!==f)k();},1000);<\/script>' +
        '</body></html>');
      document.close();
    })();
  </script>
  <link rel="stylesheet" href="css/bundle.css" />
</head>
<body>
  <script src="boot-guard.js"></script>
  <script src="core-js.bundle.js" onerror="window.NuvioBootGuard &amp;&amp; window.NuvioBootGuard.scriptFailed(this.src)"></script>
  <script defer src="main.js" onerror="window.NuvioBootGuard &amp;&amp; window.NuvioBootGuard.scriptFailed(this.src)"></script>
</body>
</html>
